[flake8]
# extend-ignore (not ignore) so pycodestyle's default suppressions are kept rather
# than replaced -- notably E226, which fires on ordinary expressions like f"{r+1}".
# E203 is a known black incompatibility: black writes slices as `a[x - 1 :]`.
extend-ignore = E731,E266,E501,C901,W503,E203
max-line-length = 99
exclude = .git,notebooks,references,models,data
